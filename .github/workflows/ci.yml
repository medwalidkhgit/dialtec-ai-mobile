name: CI - Build & Test (dialtec-ai-mobile)
# Nom affiché dans l'onglet "Actions" de GitHub, pour repérer facilement
# ce pipeline parmi d'autres si le dépôt en contient plusieurs un jour.

on:
  # Cette section répond à "quand déclencher ce workflow ?"
  push:
    # À chaque push direct sur main ou develop.
    branches: [ main, develop ]
  pull_request:
    # À chaque pull request VISANT main ou develop, avant fusion — permet
    # de voir si les tests passent avant même d'accepter le merge.
    branches: [ main, develop ]

jobs:
  # Un workflow contient un ou plusieurs jobs ; chacun tourne sur sa propre
  # machine virtuelle, indépendamment des autres. Un seul job ici, nommé
  # "build", mais il va s'exécuter plusieurs fois en parallèle grâce à la
  # matrice définie plus bas.
  build:
    runs-on: ubuntu-latest
    # Type de machine virtuelle fournie par GitHub pour exécuter ce job —
    # Ubuntu est le choix standard pour des projets Java/Maven.

    strategy:
      fail-fast: false
      # Sans ça, GitHub arrêterait TOUS les jobs restants dès qu'un seul
      # service échoue. Avec fail-fast: false, chaque service continue
      # d'être testé indépendamment — utile pour voir d'un coup TOUS les
      # services qui posent problème, pas juste le premier trouvé.

      matrix:
        # La matrice permet d'exécuter le MÊME job plusieurs fois, une fois
        # par valeur listée — ici, une fois par microservice. Concrètement,
        # GitHub va lancer 6 machines virtuelles en parallèle, chacune avec
        # matrix.service valant successivement une des 6 valeurs ci-dessous.
        service:
          - authentication-service
          - user-service
          - product-service
          - media-service
          - ai-orchestration-service
          - api-gateway

    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
        # Toutes les commandes "run:" de ce job s'exécutent automatiquement
        # depuis ce dossier — évite de répéter "cd backend/xxx &&" devant
        # chaque commande individuellement.

    steps:
      # La liste d'actions à exécuter, dans l'ordre, pour chaque service
      # de la matrice.

      - name: Checkout du code
        uses: actions/checkout@v4
        # La machine virtuelle démarre complètement vide — cette étape
        # clone le contenu du dépôt Git dedans, sinon rien d'autre ne
        # pourrait fonctionner (pas de code à compiler).

      - name: Installation JDK 17
        uses: actions/setup-java@v4
        # Installe Java sur la machine virtuelle — exactement la même
        # version que celle utilisée dans les Dockerfiles de chaque
        # service, pour éviter tout écart de comportement entre CI et
        # production.
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          # Met en cache le dossier ~/.m2/repository (les dépendances déjà
          # téléchargées) entre deux exécutions du workflow — évite de
          # retélécharger les mêmes bibliothèques Maven à chaque run,
          # accélère sensiblement les exécutions suivantes.

      - name: Build + tests (${{ matrix.service }})
        run: sh mvnw -B clean verify

      - name: Configuration des identifiants AWS
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Connexion à Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construction et envoi de l'image Docker
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/${{ matrix.service }}:latest .
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ matrix.service }}:latest

      - name: Déploiement sur le cluster EKS
        if: github.ref == 'refs/heads/main'
        run: |
          aws eks update-kubeconfig --name dialtec-cluster --region eu-west-3
          kubectl rollout restart deployment/${{ matrix.service }}
