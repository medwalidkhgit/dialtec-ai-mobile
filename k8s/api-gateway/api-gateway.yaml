apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: 942304845351.dkr.ecr.eu-west-3.amazonaws.com/api-gateway:latest
          ports:
            - containerPort: 8087
          env:
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET

---
# Contrairement à TOUS les Services précédents (internes au cluster
# uniquement, type ClusterIP par défaut), celui-ci doit être joignable
# depuis l'extérieur — le SEUL point d'entrée public de toute
# l'application. "LoadBalancer" (plutôt que "NodePort", utilisé en local
# sur Minikube) déclenche AWS pour provisionner un vrai équilibreur de
# charge, avec une adresse publique réelle, accessible depuis n'importe où.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 8087
      targetPort: 8087