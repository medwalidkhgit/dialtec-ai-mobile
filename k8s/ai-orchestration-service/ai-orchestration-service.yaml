apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-orchestration-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-orchestration-service
  template:
    metadata:
      labels:
        app: ai-orchestration-service
    spec:
      containers:
        - name: ai-orchestration-service
          image: ai-orchestration-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8086
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-ai-orchestration:5432/ai_orchestration_db
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-ai-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_USER
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_PASSWORD
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: OPENAI_API_KEY
            - name: SERVICES_MEDIA_SERVICE_URL
              value: http://media-service:8085

---
apiVersion: v1
kind: Service
metadata:
  name: ai-orchestration-service
spec:
  selector:
    app: ai-orchestration-service
  ports:
    - port: 8086
      targetPort: 8086