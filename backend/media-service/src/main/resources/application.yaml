server:
  port: 8085

spring:
  application:
    name: media-service
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

jwt:
  secret: ${JWT_SECRET}

storage:
  s3:
    endpoint: http://localhost:9000
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    region: us-east-1
    bucket: dialtec-media
    public-url: http://localhost:9000
  photo:
    allowed-content-types: image/jpeg,image/png,image/webp
    max-size-bytes: 10485760   # 10 Mo
  audio:
    allowed-content-types: audio/mpeg,audio/mp4,audio/wav,audio/webm,audio/ogg,audio/x-m4a
    max-size-bytes: 15728640   # 15 Mo